name: TEFAS fiyat geçmişini güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: '15 20 * * 1-5'

permissions:
  contents: write

concurrency:
  group: tefas-price-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: TEFAS verisini al
        run: python scripts/update_tefas_prices.py
      - name: Yeni fiyatları kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price-history.json
          git diff --cached --quiet || git commit -m "chore: TEFAS fiyat geçmişini güncelle"
          git push
